<title>Legokokoelma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a studded "baseplate" band holds the collection total; below it a grid of set boxes, filterable by theme. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --fg: #1b1f2a;
  --muted: #5d6475;
  --line: #dfe2ea;
  --plate: #ffcf1f;        /* baseplate yellow */
  --plate-stud: #f2bd00;
  --plate-fg: #1b1f2a;
  --accent: #d32f22;       /* brick red */
  --link: #1f5fbf;
  --img-bg: #ffffff;
  --t-city: #1f6fd1;
  --t-starwars: #3b3f4c;
  --t-technic: #d96a00;
  --t-minecraft: #3f8f2f;
  --t-creator: #c22a5a;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --surface: #1b1e27; --fg: #eceef3; --muted: #a2a8b8; --line: #2c303c;
    --plate: #e2b400; --plate-stud: #c99f00; --plate-fg: #15171d;
    --accent: #ff6a5c; --link: #7fb0ff; --img-bg: #f4f5f8;
    --t-city: #5b9cff; --t-starwars: #b7bccb; --t-technic: #ff9a3d; --t-minecraft: #6cc455; --t-creator: #ff6f9c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1b1e27; --fg: #eceef3; --muted: #a2a8b8; --line: #2c303c;
  --plate: #e2b400; --plate-stud: #c99f00; --plate-fg: #15171d;
  --accent: #ff6a5c; --link: #7fb0ff; --img-bg: #f4f5f8;
  --t-city: #5b9cff; --t-starwars: #b7bccb; --t-technic: #ff9a3d; --t-minecraft: #6cc455; --t-creator: #ff6f9c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Baseplate header ---------- */
.plate {
  background-color: var(--plate);
  background-image: radial-gradient(circle at 50% 50%, var(--plate-stud) 0 7px, transparent 7.5px);
  background-size: 28px 28px;
  color: var(--plate-fg);
}
.plate .wrap { padding-block: 40px 36px; display: grid; gap: 20px; }
.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
}
.total-card {
  background: var(--plate);
  justify-self: start;
  display: grid; gap: 4px;
  padding: 18px 24px 20px;
  border-radius: 6px;
  box-shadow: 0 0 0 3px var(--plate-fg);
}
.total {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(44px, 9vw, 84px);
  line-height: 1;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(26px, 4vw, 36px);
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; font-weight: 500; }
.facts b { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- Toolbar ---------- */
.toolbar { padding-block: 24px 8px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 13px/1 var(--font-body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center;
}
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
label.sort { font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
select {
  font: 500 13px var(--font-body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
}
.subtotal { font-size: 13px; color: var(--muted); padding-bottom: 12px; font-variant-numeric: tabular-nums; }
.subtotal b { color: var(--fg); }

/* ---------- Set grid ---------- */
.grid {
  list-style: none; margin: 0; padding: 0 0 56px;
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.set {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-width: 0;
}
.photo {
  background: var(--img-bg);
  aspect-ratio: 4 / 3;
  max-width: 100%;
  display: grid; place-items: center;
  position: relative;
}
.photo { overflow: hidden; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 12px; }
.photo .ph {
  font-family: var(--font-mono); font-size: 13px; color: #8a90a0;
  display: grid; place-items: center; gap: 8px; text-align: center;
}
.qty {
  position: absolute; top: 10px; right: 10px;
  background: var(--accent); color: #fff;
  font: 600 12px/1 var(--font-body); padding: 5px 8px; border-radius: 4px;
}
.body { padding: 14px 16px 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nro { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.theme {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--tc, var(--muted));
  display: inline-flex; align-items: center; gap: 5px;
}
.theme::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.name { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.foot {
  border-top: 1px solid var(--line);
  padding: 10px 16px 12px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.price { font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.price.missing { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); }
.guide { color: var(--link); font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; }
.guide:hover { text-decoration: underline; }

footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }

@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .body { padding: 10px 12px 8px; }
  .name { font-size: 15px; }
  .foot { padding: 8px 12px 10px; flex-direction: column; align-items: flex-start; gap: 4px; }
  .price { font-size: 17px; }
}
@media (prefers-reduced-motion: no-preference) {
  .set { transition: transform .15s ease, box-shadow .15s ease; }
  .set:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
}
</style>

<header class="plate">
  <div class="wrap">
    <span class="eyebrow">Legokokoelma</span>
    <div class="total-card">
      <span class="eyebrow">Pakettien yhteishinta</span>
      <span class="total" id="total">–</span>
    </div>
    <h1>Pojan legopaketit</h1>
    <div class="facts" id="facts"></div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Suodata teeman mukaan"></div>
    <label class="sort" for="sort">Järjestys
      <select id="sort">
        <option value="list">Listan järjestys</option>
        <option value="price-desc">Kallein ensin</option>
        <option value="price-asc">Edullisin ensin</option>
        <option value="nro">Settinumero</option>
      </select>
    </label>
  </div>
  <div class="subtotal" id="subtotal"></div>
  <ul class="grid" id="grid"></ul>
</main>

<footer class="wrap">
  Kuvat: Rebrickable, settinumeron perusteella. Rakennusohjeet avautuvat LEGOn palvelusivulta.
  Uuden paketin voi lisätä <code>PAKETIT</code>-listaan sivun lähdekoodissa.
</footer>

<script>
/* ===== Paketit =====
   Lisää uusi paketti tähän listaan: nro (settinumero), nimi, teema, hinta (euroina, null jos ei tiedossa), kpl.
   Kuva haetaan kansiosta kuvat/<nro>.jpg ja rakennusohje LEGOn sivulta settinumerolla. */
const PAKETIT = [
  { nro: "60414", nimi: "Paloasema ja paloauto", teema: "City", hinta: 99.95 },
  { nro: "60413", nimi: "Palokunnan pelastuslentokone", teema: "City", hinta: 72.95 },
  { nro: "60373", nimi: "Palokunnan pelastusvene", teema: "City", hinta: 24.95 },
  { nro: "60418", nimi: "Poliisin rikoslaboratorioauto", teema: "City", hinta: 64.95 },
  { nro: "75345", nimi: "501. legioonan kloonisoturit -taistelupaketti", teema: "Star Wars", hinta: 24.95 },
  { nro: "75372", nimi: "Kloonisoturin ja taisteludroidin taistelupakkaus", teema: "Star Wars", hinta: 34.95 },
  { nro: "75337", nimi: "AT-TE™-talsija", teema: "Star Wars", hinta: 179.95 },
  { nro: "75386", nimi: "Paz Vizsla™ ja Moff Gideon™ taistelussa", teema: "Star Wars", hinta: 49.95 },
  { nro: "75333", nimi: "Obi-Wan Kenobin Jedi Starfighter™", teema: "Star Wars", hinta: 39.95 },
  { nro: "60419", nimi: "Poliisivoimien Vankisaari", teema: "City", hinta: 119.95 },
  { nro: "60316", nimi: "Poliisiasema", teema: "City", hinta: 74.95 },
  { nro: "60456", nimi: "Takaa-ajo poliisiveneellä", teema: "City", hinta: 25.95 },
  { nro: "60470", nimi: "Arktisten tutkimusretkeilijöiden pikajuna", teema: "City", hinta: 179.90 },
  { nro: "60238", nimi: "Vaihtoraiteet", teema: "City", hinta: 24.95 },
  { nro: "60205", nimi: "Raiteet", teema: "City", hinta: 18.95 },
  { nro: "21276", nimi: "Creeper™", teema: "Minecraft", hinta: null },
  { nro: "21268", nimi: "Porsasvauvan talo", teema: "Minecraft", hinta: null },
  { nro: "21587", nimi: "Zombiluolasto", teema: "Minecraft", hinta: null },
  { nro: "60448", nimi: "Urheiluauto", teema: "City", hinta: null },
  { nro: "42179", nimi: "Maapallo ja Kuu kiertoradalla", teema: "Technic", hinta: null },
  { nro: "60503", nimi: "Rannikkovartioston helikopteri", teema: "City", hinta: 55.00 },
  { nro: "60504", nimi: "Rannikkovartioston pelastusvene ja helikopteri", teema: "City", hinta: 120.00 },
  { nro: "7738",  nimi: "Rannikkovartioston helikopteri ja pelastuslautta", teema: "City", hinta: null, kpl: 2 },
  { nro: "42105", nimi: "Katamaraani", teema: "Technic", hinta: 25.00 },
  { nro: "42221", nimi: "NASA Artemis -avaruusraketti", teema: "Technic", hinta: 52.99 },
  { nro: "31387", nimi: "Ikoninen merirosvolaiva", teema: "Creator 3in1", hinta: 64.99 },
];

const THEME_COLOR = {
  "City": "var(--t-city)", "Star Wars": "var(--t-starwars)", "Technic": "var(--t-technic)",
  "Minecraft": "var(--t-minecraft)", "Creator 3in1": "var(--t-creator)",
};
const eur = new Intl.NumberFormat("fi-FI", { style: "currency", currency: "EUR" });
const kpl = p => p.kpl || 1;
const rivihinta = p => (p.hinta ?? 0) * kpl(p);
const sum = list => list.reduce((s, p) => s + rivihinta(p), 0);
const ohje = nro => `https://www.lego.com/fi-fi/service/building-instructions/${nro}`;
const kuvaLahteet = nro => [
  `kuvat/${nro}.jpg`,
  `https://cdn.rebrickable.com/media/sets/${nro}-1.jpg`,
  `https://images.brickset.com/sets/images/${nro}-1.jpg`,
];

let teema = "Kaikki";
let jarjestys = "list";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderHeader() {
  const kplYht = PAKETIT.reduce((s, p) => s + kpl(p), 0);
  const puuttuu = PAKETIT.filter(p => p.hinta == null);
  document.getElementById("total").textContent = eur.format(sum(PAKETIT));
  document.getElementById("facts").innerHTML =
    `<span><b>${kplYht}</b> pakettia</span>` +
    `<span><b>${new Set(PAKETIT.map(p => p.teema)).size}</b> teemaa</span>` +
    (puuttuu.length ? `<span>Hinta puuttuu ${puuttuu.length} setiltä (${puuttuu.map(p => p.nro).join(", ")})</span>` : "");
}

function renderChips() {
  const teemat = ["Kaikki", ...new Set(PAKETIT.map(p => p.teema))];
  const el = document.getElementById("chips");
  el.innerHTML = teemat.map(t => {
    const n = t === "Kaikki" ? PAKETIT.reduce((s, p) => s + kpl(p), 0)
                             : PAKETIT.filter(p => p.teema === t).reduce((s, p) => s + kpl(p), 0);
    return `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === teema}">${esc(t)} <span class="n">${n}</span></button>`;
  }).join("");
}

function renderGrid() {
  let list = PAKETIT.map((p, i) => ({ ...p, i }));
  if (teema !== "Kaikki") list = list.filter(p => p.teema === teema);
  if (jarjestys === "price-desc") list.sort((a, b) => (b.hinta ?? -1) - (a.hinta ?? -1));
  if (jarjestys === "price-asc") list.sort((a, b) => (a.hinta ?? Infinity) - (b.hinta ?? Infinity));
  if (jarjestys === "nro") list.sort((a, b) => Number(a.nro) - Number(b.nro));

  document.getElementById("subtotal").innerHTML = teema === "Kaikki" ? "" :
    `${esc(teema)}: <b>${eur.format(sum(list))}</b>`;

  document.getElementById("grid").innerHTML = list.map(p => `
    <li class="set" style="--tc:${THEME_COLOR[p.teema] || "var(--muted)"}">
      <div class="photo">
        <img alt="${esc(p.nimi)}" loading="lazy" data-nro="${esc(p.nro)}" data-try="0" src="${kuvaLahteet(p.nro)[0]}">
        ${kpl(p) > 1 ? `<span class="qty">${kpl(p)} kpl</span>` : ""}
      </div>
      <div class="body">
        <div class="meta"><span class="theme">${esc(p.teema)}</span><span class="nro">#${esc(p.nro)}</span></div>
        <h2 class="name">${esc(p.nimi)}</h2>
      </div>
      <div class="foot">
        ${p.hinta == null
          ? `<span class="price missing">Hinta ei tiedossa</span>`
          : `<span class="price">${eur.format(p.hinta)}${kpl(p) > 1 ? ` <small>/kpl</small>` : ""}</span>`}
        <a class="guide" href="${ohje(p.nro)}" target="_blank" rel="noopener">Rakennusohje ↗</a>
      </div>
    </li>`).join("");

  document.querySelectorAll(".photo img").forEach(img => {
    img.addEventListener("error", () => {
      const lahteet = kuvaLahteet(img.dataset.nro);
      const next = Number(img.dataset.try) + 1;
      if (next < lahteet.length) { img.dataset.try = next; img.src = lahteet[next]; }
      else {
        const ph = document.createElement("div");
        ph.className = "ph";
        ph.innerHTML = `<svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"><rect x="2" y="12" width="52" height="26" rx="3" fill="#c9ccd6"/><rect x="9" y="4" width="14" height="10" rx="2" fill="#c9ccd6"/><rect x="33" y="4" width="14" height="10" rx="2" fill="#c9ccd6"/></svg><span>#${esc(img.dataset.nro)}</span>`;
        img.replaceWith(ph);
      }
    }, { once: false });
  });
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  teema = b.dataset.t;
  renderChips(); renderGrid();
});
document.getElementById("sort").addEventListener("change", e => { jarjestys = e.target.value; renderGrid(); });

renderHeader();
renderChips();
renderGrid();
</script>
